[pytest]
markers =
    external_llm: llama a un LLM real (Groq). Excluido del gate unitario por defecto.
    integration: prueba de integración (servicios reales).
# Gate unitario por defecto NO corre external_llm (evita fallos por cuota/varianza).
# Para correr la eval: pytest -m external_llm
addopts = -m "not external_llm"
